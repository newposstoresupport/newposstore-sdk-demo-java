import java.text.SimpleDateFormat
import java.util.Properties

plugins {
    id 'com.android.application'
}

/** 读取凭据与可选配置：环境变量 > Gradle -P > 根目录 local.properties（勿将密钥提交仓库）。 */
def storeSdkProp = { String key ->
    def e = System.getenv(key)
    if (e != null) return e
    if (project.hasProperty(key)) return project.property(key).toString()
    def lp = rootProject.file('local.properties')
    if (lp.exists()) {
        def p = new Properties()
        lp.withInputStream { p.load(it) }
        def v = p.getProperty(key)
        if (v != null) return v
    }
    return ''
}

android {
    namespace 'com.android.newpos.store.sdk.demo'
    compileSdk 33

    String version = new SimpleDateFormat("1.3.yyyyMMddHHmmss").format(new Date())

    defaultConfig {
        applicationId "com.android.newpos.store.sdk.demo"
        minSdk 22
        targetSdk 33
        versionCode 3
        versionName version

        //versionCode 2//后台强关联版本号，先改2进行测试
        //versionName "1.2.20260129164758"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        def notAnn = project.findProperty('instrumentNotAnnotation')?.toString()?.trim()
        if (notAnn) {
            testInstrumentationRunnerArgument 'notAnnotation', notAnn
        }
        def annOnly = project.findProperty('instrumentAnnotation')?.toString()?.trim()
        if (annOnly) {
            testInstrumentationRunnerArgument 'annotation', annOnly
        }
    }
    signingConfigs {
        newstore{
            keyAlias 'newstore'
            keyPassword 'newstore'
            storeFile file('newstore.jks')
            storePassword 'newpos'
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.newstore
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.newstore
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    android.applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "NewStoreSdkDemo" +
                    "-${variant.productFlavors[0].name}" +
                    "-${defaultConfig.versionName}" +
                    "-${variant.buildType.name}.apk"
        }

    }

    flavorDimensions "env"
    productFlavors {
        dft {
            applicationId "com.android.newpos.store.sdk.demo"
            dimension "env"
            buildConfigField("String", "APPID", "\"${storeSdkProp('STORESDK_DEMO_DFT_APP_ID')}\"")
            buildConfigField("String", "APPKEY", "\"${storeSdkProp('STORESDK_DEMO_DFT_APP_KEY')}\"")
            buildConfigField("String", "APPSECRET", "\"${storeSdkProp('STORESDK_DEMO_DFT_APP_SECRET')}\"")
        }
        LM {
            applicationId "com.android.newpos.limiao.sdk.demo"
            dimension "env"
            buildConfigField("String", "APPID", "\"${storeSdkProp('STORESDK_DEMO_LM_APP_ID')}\"")
            buildConfigField("String", "APPKEY", "\"${storeSdkProp('STORESDK_DEMO_LM_APP_KEY')}\"")
            buildConfigField("String", "APPSECRET", "\"${storeSdkProp('STORESDK_DEMO_LM_APP_SECRET')}\"")
        }
        ZL {
            applicationId "com.zhangle_sdk.test"
            dimension "env"
            buildConfigField("String", "APPID", "\"${storeSdkProp('STORESDK_DEMO_ZL_APP_ID')}\"")
            buildConfigField("String", "APPKEY", "\"${storeSdkProp('STORESDK_DEMO_ZL_APP_KEY')}\"")
            buildConfigField("String", "APPSECRET", "\"${storeSdkProp('STORESDK_DEMO_ZL_APP_SECRET')}\"")
        }
        staging {
            applicationId "com.android.newpos.store.sdk.demo"
            dimension "env"
            buildConfigField("String", "APPID", "\"${storeSdkProp('STORESDK_STAGING_APP_ID')}\"")
            buildConfigField("String", "APPKEY", "\"${storeSdkProp('STORESDK_STAGING_APP_KEY')}\"")
            buildConfigField("String", "APPSECRET", "\"${storeSdkProp('STORESDK_STAGING_APP_SECRET')}\"")
        }
    }
}

