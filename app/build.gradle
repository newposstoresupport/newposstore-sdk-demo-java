import java.text.SimpleDateFormat

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.android.newpos.store.sdk.demo'
    compileSdk 33

    String version = new SimpleDateFormat("1.3.yyyyMMddHHmmss").format(new Date())

    defaultConfig {
        applicationId "com.android.newpos.store.sdk.demo"
        minSdk 22
        targetSdk 33
        versionCode 3
        versionName version

        //versionCode 2//后台强关联版本号，先改2进行测试
        //versionName "1.2.20260129164758"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        newstore{
            keyAlias 'newstore'
            keyPassword 'newstore'
            storeFile file('newstore.jks')
            storePassword 'newpos'
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.newstore
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.newstore
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    android.applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "NewStoreSdkDemo" +
                    "-${variant.productFlavors[0].name}" +
                    "-${defaultConfig.versionName}" +
                    "-${variant.buildType.name}.apk"
        }

    }

    flavorDimensions "env"
    productFlavors {
        dft {
            applicationId "com.android.newpos.store.sdk.demo"
            dimension "env"
            buildConfigField("String", "APPID", "\"32292cc7e05a2b86ddea1d6746210283\"")
            buildConfigField("String", "APPKEY", "\"c3ff54daf66bbbd2e8d8dbf08172a5aa\"")
            buildConfigField("String", "APPSECRET", "\"a8e2188e9474692ea6a538f0a4f955ab\"")
        }
        LM {
            applicationId "com.android.newpos.limiao.sdk.demo"
            dimension "env"
            buildConfigField("String", "APPID", "\"df23718a599c6b7b6ef897ca6bf0eea8\"")
            buildConfigField("String", "APPKEY", "\"9c9664484e93b30437bf5eb81694530b\"")
            buildConfigField("String", "APPSECRET", "\"69c2b57ec2937c9fb7500a9225bc02fe\"")
        }
        ZL {
            applicationId "com.zhangle_sdk.test"
            dimension "env"
            buildConfigField("String", "APPID", "\"0ab12c358f5c385bf7f01fa0c6708547\"")
            buildConfigField("String", "APPKEY", "\"d0351301924fd0c390c3541fd7e87c35\"")
            buildConfigField("String", "APPSECRET", "\"faebbeb4fd2cc76d32b6869a92c1e714\"")
        }
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1'
    implementation 'androidx.navigation:navigation-fragment:2.5.3'
    implementation 'androidx.navigation:navigation-ui:2.5.3'
    implementation "androidx.work:work-runtime:2.7.0"
    implementation 'androidx.preference:preference:1.2.1'
    implementation "androidx.window:window:1.1.0"
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.20")
    implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.20")

    implementation "io.reactivex.rxjava2:rxandroid:2.1.1"
    implementation "io.reactivex.rxjava2:rxjava:2.1.7"

    implementation 'com.tencent:mmkv:1.2.10'


    //Directly dependent projects
    implementation project(':api')
    implementation project(':aidl')

    //Dependency central warehouse
    //implementation "io.github.newposstoresupport:api:1.0.1"
    //implementation "io.github.newposstoresupport:aidl:1.1"

    implementation 'com.squareup.okhttp3:okhttp:4.2.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.2.0'
    implementation 'com.google.code.gson:gson:2.9.0'

    implementation "com.liulishuo.filedownloader:library:1.7.7"
    implementation "cn.dreamtobe.filedownloader:filedownloader-okhttp3-connection:1.1.0"

    implementation files("libs/android-baserecyle-master-v1.1.aar")
}